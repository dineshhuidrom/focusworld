<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paper Trail · Free First Reply</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Paper Trail. One calm, light "case file" world: warm paper, ink, a yellow highlighter.
   Layout: one phone-width column. The 48-hour ring is the hero; everything else is a card under it. */
:root {
  --paper: #F7F4EE;
  --card: #FFFFFF;
  --ink: #0F1729;
  --ink2: #3A4458;
  --muted: #6B7385;
  --rule: #E4DCCD;
  --rule2: #F0EADF;
  --mark: #FFE45A;
  --mark2: #FFF4B8;
  --red: #B93A26;
  --red2: #FBEAE6;
  --green: #1F7A53;
  --green2: #E2F2E9;
  --serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
  --sans: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --r: 16px;
  --shadow: 0 1px 0 rgba(15, 23, 41, 0.04), 0 10px 26px -14px rgba(15, 23, 41, 0.22);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  background-image: radial-gradient(ellipse 80% 40% at 50% 0%, rgba(255, 228, 90, 0.16), rgba(255, 228, 90, 0) 70%);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15.5px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--ink); }
.app { max-width: 460px; margin: 0 auto; padding: 12px 18px calc(110px + env(safe-area-inset-bottom)); }
.app.notabs { padding-bottom: 48px; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; padding: 6px 2px 10px; }
.brand { display: flex; gap: 8px; align-items: center; font-family: var(--mono); font-weight: 700; font-size: 12px; letter-spacing: 0.18em; }
.brand svg { width: 22px; height: 22px; }
.top-r { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase; }

/* Type */
h1 { font-family: var(--serif); font-weight: 400; font-size: 46px; line-height: 1.0; letter-spacing: -0.01em; margin: 14px 0 14px; }
h1 em, h2 em { font-style: italic; }
h2 { font-family: var(--serif); font-weight: 400; font-size: 32px; line-height: 1.05; margin: 6px 0 8px; }
h3 { font-size: 16.5px; font-weight: 700; margin: 0; line-height: 1.3; }
.kicker { font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.lead { font-size: 16.5px; line-height: 1.55; color: var(--ink2); margin: 0 0 18px; }
.small { font-size: 13px; color: var(--muted); line-height: 1.45; }
.mk { background: linear-gradient(104deg, rgba(255, 228, 90, 0) 0.9%, var(--mark) 2.4%, var(--mark) 96%, rgba(255, 228, 90, 0) 98%); padding: 0 0.14em; border-radius: 0.25em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.sec { margin: 26px 0 8px; }
.sec .kicker { margin-bottom: 4px; }

/* Cards */
.card { background: var(--card); border: 1px solid var(--rule); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); margin: 12px 0; position: relative; }
.card.tint { background: var(--mark2); border-color: #EAD98A; }
.card.dark { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.card.dark .small, .card.dark .kicker { color: #AEB6C6; }
.card.warn { border-color: #EBC2B8; background: #FFF8F6; }

/* Buttons */
.btn { appearance: none; border: 1.5px solid var(--ink); background: var(--card); color: var(--ink); border-radius: 12px; padding: 11px 15px; font-weight: 650; font-size: 14.5px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; text-decoration: none; box-shadow: 0 3px 0 var(--ink); transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.2s ease, color 0.2s ease; -webkit-tap-highlight-color: transparent; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn:focus-visible, .opt:focus-visible, .chipbtn:focus-visible, .tab:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }
.btn.primary { background: var(--ink); color: var(--paper); box-shadow: 0 3px 0 #000; }
.btn.mark { background: var(--mark); }
.btn.big { width: 100%; padding: 16px; font-size: 16.5px; border-radius: 14px; }
.btn.ghost { border-color: var(--rule); box-shadow: 0 2px 0 var(--rule); }
.btn.sm { padding: 8px 12px; font-size: 13.5px; border-radius: 10px; }
.btn.copied { background: var(--green); border-color: var(--green); color: #fff; box-shadow: 0 3px 0 #0E4A31; }
.btn svg { width: 17px; height: 17px; flex: 0 0 auto; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.row .btn { flex: 1 1 auto; }
.private { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; justify-content: center; margin-top: 12px; }
.private svg { width: 15px; height: 15px; }
.link { appearance: none; background: none; border: 0; padding: 0; color: var(--ink); font-weight: 650; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

/* Guide character: Trail, a small paper plane. Used only at key moments. */
.guide { display: flex; gap: 10px; align-items: flex-start; margin: 18px 0; }
.guide .av { width: 40px; height: 40px; border-radius: 50%; background: var(--mark); border: 1.5px solid var(--ink); display: grid; place-items: center; flex: 0 0 40px; animation: bob 4s ease-in-out infinite; }
.guide .av svg { width: 22px; height: 22px; }
.guide .bub { background: var(--card); border: 1px solid var(--rule); border-radius: 14px 14px 14px 4px; padding: 10px 13px; font-size: 14.5px; line-height: 1.45; box-shadow: var(--shadow); }
.guide .bub b { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 2px; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-3px) rotate(3deg); } }

/* Setup */
.prog { display: flex; gap: 6px; margin: 2px 0 20px; }
.prog i { height: 4px; flex: 1; background: var(--rule); border-radius: 4px; transition: background 0.3s ease; }
.prog i.on { background: var(--ink); }
.opt { appearance: none; display: flex; width: 100%; text-align: left; padding: 16px; border: 1.5px solid var(--rule); border-radius: 14px; background: var(--card); margin: 10px 0; font-weight: 650; font-size: 15.5px; gap: 12px; align-items: center; cursor: pointer; transition: border-color 0.2s, background 0.2s, box-shadow 0.2s, transform 0.12s; }
.opt:active { transform: scale(0.99); }
.opt .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--rule2); display: grid; place-items: center; flex: 0 0 34px; }
.opt .ic svg { width: 19px; height: 19px; }
.opt .sub { display: block; font-weight: 400; font-size: 13px; color: var(--muted); margin-top: 2px; }
.opt[aria-pressed="true"] { border-color: var(--ink); background: var(--mark2); box-shadow: 0 3px 0 var(--ink); }
.opt[aria-pressed="true"] .ic { background: var(--mark); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chipbtn { appearance: none; border: 1.5px solid var(--rule); background: var(--card); border-radius: 999px; padding: 9px 13px; font-weight: 600; font-size: 14px; cursor: pointer; display: inline-flex; gap: 7px; align-items: center; transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.12s; }
.chipbtn:active { transform: scale(0.97); }
.chipbtn[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.25; }
.dots i.on { opacity: 1; }
.field { margin: 12px 0; }
.field label { display: block; font-weight: 650; font-size: 14px; margin-bottom: 6px; }
.field .hint { font-weight: 400; color: var(--muted); }
input[type="text"], input[type="date"], input[type="datetime-local"], select, textarea { width: 100%; font-size: 16px; padding: 12px; border: 1.5px solid var(--rule); border-radius: 12px; background: var(--card); transition: border-color 0.2s, box-shadow 0.2s; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 4px var(--mark2); }
.err { color: var(--red); font-size: 13.5px; font-weight: 600; margin-top: 8px; }
.navrow { display: flex; gap: 10px; margin-top: 22px; }
.navrow .btn { flex: 1; }

/* Ring */
.ringwrap { position: relative; width: 264px; height: 264px; margin: 4px auto 0; }
.ringwrap svg { width: 100%; height: 100%; display: block; }
.ringwrap .c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; }
.cd { font-family: var(--serif); font-size: 48px; line-height: 1; }
.cd small { font-size: 26px; }
.cdl { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase; margin-top: 7px; max-width: 132px; line-height: 1.4; }
.cdp { margin-top: 10px; font-size: 13px; font-weight: 650; background: var(--mark); border: 1.5px solid var(--ink); border-radius: 999px; padding: 3px 10px; }
.arc-draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 0.9s cubic-bezier(0.3, 0.7, 0.2, 1) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 0%, 100% { opacity: 0.45; transform: scale(1); } 50% { opacity: 0; transform: scale(1.9); } }

/* Phases */
.phase { padding: 0; overflow: hidden; }
.phase .hd { appearance: none; width: 100%; background: none; border: 0; text-align: left; display: flex; gap: 12px; align-items: center; padding: 16px 16px 14px; cursor: pointer; }
.pnum { font-family: var(--serif); font-size: 36px; line-height: 0.9; width: 42px; flex: 0 0 42px; }
.pmeta { flex: 1; min-width: 0; }
.pname { font-weight: 700; font-size: 17px; }
.ptime { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.04em; margin-top: 2px; }
.chip { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; border: 1px solid var(--rule); white-space: nowrap; color: var(--muted); }
.chip.now { background: var(--mark); border-color: var(--ink); color: var(--ink); }
.chip.done { background: var(--green2); color: var(--green); border-color: transparent; }
.chip.late { background: var(--red2); color: var(--red); border-color: transparent; }
.pbar { height: 3px; background: var(--rule2); margin: 0 16px; border-radius: 3px; overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--ink); transition: width 0.45s cubic-bezier(0.3, 0.7, 0.2, 1); }
.phase .bd { padding: 6px 16px 14px; }
.phase .goal { font-size: 14.5px; color: var(--ink2); margin: 8px 0 4px; }
.phase.is-now { border-color: var(--ink); box-shadow: 0 3px 0 var(--ink), var(--shadow); }
.step { appearance: none; width: 100%; background: none; border: 0; border-top: 1px dashed var(--rule); text-align: left; display: flex; gap: 12px; padding: 12px 0; align-items: flex-start; cursor: pointer; }
.cb { flex: 0 0 26px; height: 26px; border: 1.8px solid var(--ink); border-radius: 8px; background: var(--card); display: grid; place-items: center; transition: background 0.2s ease, transform 0.15s ease; }
.cb svg { width: 16px; height: 16px; }
.cb path { stroke-dasharray: 22; stroke-dashoffset: 22; transition: stroke-dashoffset 0.32s ease 0.05s; }
.step:active .cb { transform: scale(0.9); }
.step.on .cb { background: var(--ink); }
.step.on .cb path { stroke-dashoffset: 0; }
.st { font-size: 15px; line-height: 1.4; padding-top: 2px; transition: color 0.2s; }
.step.on .st { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(15, 23, 41, 0.35); }
.chip.fresh { animation: stamp 0.55s cubic-bezier(0.2, 1.5, 0.4, 1) both; }
.stamp { position: absolute; right: 14px; top: 58px; font-family: var(--mono); font-weight: 700; font-size: 12px; letter-spacing: 0.22em; color: var(--green); border: 2px solid var(--green); border-radius: 6px; padding: 4px 8px; transform: rotate(-8deg); pointer-events: none; background: rgba(255, 255, 255, 0.7); }
.stamp.fresh { animation: stamp 0.5s cubic-bezier(0.2, 1.5, 0.4, 1) both; }
@keyframes stamp { 0% { transform: rotate(-10deg) scale(2); opacity: 0; } 60% { transform: rotate(-4deg) scale(0.92); opacity: 1; } 100% { transform: none; opacity: 1; } }

/* Templates */
.tpl .subj { font-family: var(--mono); font-size: 12px; color: var(--ink2); background: var(--rule2); padding: 8px 10px; border-radius: 8px; margin: 12px 0 10px; word-break: break-word; }
.tpl .body { white-space: pre-wrap; font-size: 14.5px; line-height: 1.55; border-left: 3px solid var(--ink); padding: 2px 0 2px 12px; word-break: break-word; }
.ph { background: var(--mark2); border-bottom: 1.5px dashed #C9A800; padding: 0 1px; border-radius: 3px; }
.fv { font-weight: 650; }
.tpl .when { display: inline-block; margin-top: 6px; }
details.more { margin-top: 10px; }
details.more summary { cursor: pointer; font-weight: 650; list-style: none; display: flex; align-items: center; gap: 8px; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::before { content: "+"; font-family: var(--mono); width: 22px; height: 22px; border: 1.5px solid var(--ink); border-radius: 6px; display: grid; place-items: center; font-size: 14px; transition: transform 0.2s; }
details.more[open] summary::before { content: "\2212"; }
ul.ticks, ol.nums { margin: 10px 0 0; padding: 0; list-style: none; }
ul.ticks li, ol.nums li { position: relative; padding: 6px 0 6px 30px; font-size: 14.5px; line-height: 1.45; }
ul.ticks li::before { content: ""; position: absolute; left: 4px; top: 10px; width: 14px; height: 8px; border-left: 2px solid var(--green); border-bottom: 2px solid var(--green); transform: rotate(-45deg); }
ul.ticks.dot li::before { width: 7px; height: 7px; border: 0; transform: none; left: 7px; top: 14px; border-radius: 50%; background: var(--ink); }
ul.ticks.alert li::before { content: "!"; width: 18px; height: 18px; border: 0; transform: none; left: 2px; top: 7px; border-radius: 50%; background: var(--red); color: #fff; font: 700 12px/18px var(--mono); text-align: center; }
ul.ticks.x li::before { width: 12px; height: 12px; border: 0; transform: none; left: 5px; top: 10px; background: linear-gradient(45deg, transparent 43%, var(--red) 43%, var(--red) 57%, transparent 57%), linear-gradient(-45deg, transparent 43%, var(--red) 43%, var(--red) 57%, transparent 57%); }
ol.nums { counter-reset: n; }
ol.nums li { counter-increment: n; }
ol.nums li::before { content: counter(n); position: absolute; left: 0; top: 6px; width: 21px; height: 21px; border-radius: 50%; background: var(--ink); color: var(--paper); font-family: var(--mono); font-size: 11px; display: grid; place-items: center; font-weight: 700; }
.li-sub { display: block; color: var(--muted); font-size: 13.5px; }

/* Proof */
.proof .ph2 { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.str { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); display: flex; gap: 6px; align-items: center; white-space: nowrap; }
.toggle { appearance: none; border: 1.5px solid var(--ink); border-radius: 999px; background: var(--card); padding: 8px 12px; font-weight: 650; font-size: 13.5px; display: inline-flex; gap: 8px; align-items: center; cursor: pointer; margin-top: 12px; box-shadow: 0 2px 0 var(--ink); transition: background 0.2s, color 0.2s, transform 0.12s; }
.toggle:active { transform: translateY(1px); }
.toggle[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #fff; box-shadow: 0 2px 0 #0E4A31; }
.tl-row { display: grid; grid-template-columns: 1fr 44px; gap: 6px; margin: 4px 0 14px; padding-bottom: 14px; border-bottom: 1px dashed var(--rule); align-items: center; }
.tl-row .w, .tl-row select { grid-column: 1 / -1; }
.tl-row input, .tl-row select { padding: 10px; font-size: 15px; }
.iconbtn { appearance: none; border: 1.5px solid var(--rule); background: var(--card); border-radius: 10px; height: 44px; display: grid; place-items: center; cursor: pointer; }
.iconbtn svg { width: 17px; height: 17px; }
.tl-out { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; background: var(--rule2); border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
.empty { border: 1.5px dashed var(--rule); border-radius: 14px; padding: 16px; text-align: center; color: var(--muted); font-size: 14px; }

/* Meeting flip cards */
.flip { perspective: 1200px; margin-top: 12px; }
.flip .inner { position: relative; height: 236px; transition: transform 0.55s cubic-bezier(0.3, 0.7, 0.2, 1); transform-style: preserve-3d; }
.flip.on .inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid var(--rule); background: var(--card); box-shadow: var(--shadow); cursor: pointer; }
.face .q { font-family: var(--serif); font-size: 27px; line-height: 1.12; }
.face.back { transform: rotateY(180deg); background: var(--ink); color: var(--paper); border-color: var(--ink); }
.face.back .q { font-size: 21px; }
.face .hint2 { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.face.back .hint2 { color: #AEB6C6; }
.qnav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; }
.qdots { display: flex; gap: 5px; }
.qdots i { width: 7px; height: 7px; border-radius: 50%; background: var(--rule); }
.qdots i.on { background: var(--ink); }

/* Help */
.kv { display: grid; gap: 4px; margin-top: 8px; }
.kv h4 { margin: 14px 0 2px; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.tool-row { border-top: 1px dashed var(--rule); padding: 10px 0; font-size: 14.5px; }
.tool-row b { display: block; }
.tool-row span { color: var(--ink2); }

/* Free: locked previews */
.lock { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px dashed rgba(247, 244, 238, 0.2); }
.lock:first-of-type { border-top: 0; }
.lock .lk { width: 32px; height: 32px; border-radius: 9px; background: rgba(255, 228, 90, 0.14); display: grid; place-items: center; flex: 0 0 32px; }
.lock .lk svg { width: 16px; height: 16px; }
.lock b { display: block; font-size: 14.5px; }
.lock span { font-size: 13px; color: #AEB6C6; }
.price { font-family: var(--serif); font-size: 44px; line-height: 1; }

/* Tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(247, 244, 238, 0.94); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-top: 1px solid var(--rule); padding: 6px 10px calc(6px + env(safe-area-inset-bottom)); display: flex; justify-content: center; z-index: 5; }
.tabs .in { max-width: 460px; width: 100%; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.tab { appearance: none; border: 0; background: transparent; border-radius: 12px; padding: 7px 2px 6px; font-size: 11px; font-weight: 650; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; transition: background 0.2s, color 0.2s; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--ink); background: var(--mark2); }

/* Toast + modal */
.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translate(-50%, 16px); opacity: 0; background: var(--ink); color: var(--paper); padding: 11px 15px; border-radius: 14px; font-size: 14.5px; display: flex; gap: 9px; align-items: center; transition: opacity 0.25s ease, transform 0.25s ease; pointer-events: none; width: max-content; max-width: 88vw; z-index: 20; box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast .av { width: 26px; height: 26px; border-radius: 50%; background: var(--mark); display: grid; place-items: center; flex: 0 0 26px; }
.toast .av svg { width: 15px; height: 15px; }
.modal { position: fixed; inset: 0; background: rgba(15, 23, 41, 0.55); display: flex; align-items: flex-end; justify-content: center; padding: 14px; z-index: 30; }
.modal[hidden] { display: none; }
.sheet { background: var(--card); border-radius: 18px; padding: 18px; width: 100%; max-width: 460px; animation: up 0.28s ease both; }
.sheet textarea { height: 230px; font-size: 14px; margin-top: 10px; }
@keyframes up { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }

.screen { animation: in 0.3s ease both; }
@keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.foot { text-align: center; font-size: 12px; color: var(--muted); margin: 30px 0 0; line-height: 1.6; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }

/* ---------- the plan clock ---------- */
function bounds() {

  const W = t4 - t0;
  if (W >= 48 * HOUR) return [t0, t0 + 2 * HOUR, t0 + 12 * HOUR, t0 + 24 * HOUR, t4];

function setupError() {
  const s = st.setup;

function ringSVG(b, now, animate, statuses) {
  const cx = 100, cy = 100, R = 78, W = 13;
  const T = b[4] - b[0];
  const ang = (t) => Math.max(0, Math.min(1, (t - b[0]) / T)) * 360;
  const pt = (deg, r) => { const a = (deg - 90) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
  const arc = (d0, d1, r) => { const [x0, y0] = pt(d0, r), [x1, y1] = pt(d1, r); return 'M' + x0.toFixed(2) + ',' + y0.toFixed(2) + ' A' + r + ',' + r + ' 0 ' + (d1 - d0 > 180 ? 1 : 0) + ' 1 ' + x1.toFixed(2) + ',' + y1.toFixed(2); };
  const info = statuses ? DATA.phases.map((p, i) => Object.assign({}, p, { status: statuses[i] })) : phaseInfo();
  let s = '<svg viewBox="0 0 200 200" role="img" aria-label="Your 48-hour plan as a clock">';
  for (let i = 0; i < 48; i++) {
    const d = i * 7.5, long = i % 6 === 0;
    const [x0, y0] = pt(d, 93), [x1, y1] = pt(d, long ? 99 : 96);
    s += '<line x1="' + x0.toFixed(2) + '" y1="' + y0.toFixed(2) + '" x2="' + x1.toFixed(2) + '" y2="' + y1.toFixed(2) + '" stroke="#0F1729" stroke-opacity="' + (long ? 0.5 : 0.2) + '" stroke-width="' + (long ? 1.3 : 0.9) + '" stroke-linecap="round"/>';
  }
  s += '<circle cx="100" cy="100" r="' + R + '" fill="none" stroke="#F0EADF" stroke-width="' + W + '"/>';
  info.forEach((p, i) => {
    const gap = 1.6;
    const d0 = ang(b[i]) + (i ? gap / 2 : 0), d1 = ang(b[i + 1]) - (i < 3 ? gap / 2 : 0);
    if (d1 - d0 < 0.6) return;
    // Done = green, now = highlighter yellow, overdue = soft red, still to come = ink, fading with distance.
    const col = p.status === 'now' ? '#FFE45A' : p.status === 'done' ? '#1F7A53' : p.status === 'late' ? '#B93A26' : '#0F1729';
    const op = p.status === 'next' ? [0.85, 0.85, 0.6, 0.38][i] : p.status === 'late' ? 0.75 : 1;
    const path = arc(d0, d1, R);
    const len = (Math.PI * 2 * R * (d1 - d0) / 360).toFixed(1);
    if (p.status === 'now') s += '<path d="' + path + '" fill="none" stroke="#0F1729" stroke-width="' + (W + 3) + '" stroke-linecap="butt"' + (animate ? ' class="arc-draw" style="--len:' + len + '"' : '') + '/>';
    s += '<path d="' + path + '" fill="none" stroke="' + col + '" stroke-opacity="' + op + '" stroke-width="' + W + '" stroke-linecap="butt"' + (animate ? ' class="arc-draw" style="--len:' + len + '"' : '') + '/>';
    const [lx, ly] = pt((d0 + d1) / 2, R);
    if (d1 - d0 > 24) s += '<text x="' + lx.toFixed(1) + '" y="' + (ly + 2.7).toFixed(1) + '" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="7.5" font-weight="700" fill="' + (p.status === 'now' ? '#0F1729' : '#FFFFFF') + '">' + p.n + '</text>';
  });

  const [nx, ny] = pt(dn, R);

    s += '<line x1="' + ix.toFixed(2) + '" y1="' + iy.toFixed(2) + '" x2="' + nx.toFixed(2) + '" y2="' + ny.toFixed(2) + '" stroke="#0F1729" stroke-width="1.6" stroke-linecap="round"/>';
    s += '<circle class="pulse" cx="' + nx.toFixed(2) + '" cy="' + ny.toFixed(2) + '" r="9" fill="#0F1729" opacity="0.4"/>';
    s += '<circle cx="' + nx.toFixed(2) + '" cy="' + ny.toFixed(2) + '" r="5.6" fill="#0F1729" stroke="#FFE45A" stroke-width="2.4"/>';
  }

}

function fill(tpl, v, html) {
  if (!String(v.student_id || '').trim()) tpl = tpl.replace(/\n\{student_id\}/g, '');
  let out = '', last = 0;
  const re = /\{(\w+)\}/g;
  let m;
  while ((m = re.exec(tpl))) {
    const lit = tpl.slice(last, m.index);
    out += html ? esc(lit) : lit;
    const val = String(v[m[1]] || '').trim();
    const lab = '[' + (DATA.labels[m[1]] || m[1]) + ']';
    if (val) out += html ? '<span class="fv">' + esc(val) + '</span>' : val;
    else out += html ? '<span class="ph">' + esc(lab) + '</span>' : lab;
    last = re.lastIndex;
  }
  const tail = tpl.slice(last);
  out += html ? esc(tail) : tail;

  if (html) out = out.replace(/\[([^\]<]{2,170})\]/g, (all, inner) => all.indexOf('class=') > -1 ? all : '<span class="ph">[' + inner + ']</span>');

/* ---------- clipboard with fallbacks (artifact frames can block the clipboard API) ---------- */
async function copyText(txt, btn) {
  let ok = false;
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(txt); ok = true; } } catch (e) { ok = false; }
  if (!ok) {
    try {
      const ta = document.createElement('textarea');
      ta.value = txt; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.top = '-1000px';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, txt.length);
      ok = document.execCommand('copy');
      ta.remove();
    } catch (e) { ok = false; }
  }
  if (ok && btn) {
    const old = btn.innerHTML;
    btn.classList.add('copied');
    btn.innerHTML = I.check + '<span>Copied</span>';
    setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = old; }, 1700);
  } else if (!ok) {
    openCopySheet(txt);
  }
}

  m.hidden = false;

  const s = st.setup;
  if (!st.evidenceBy) st.evidenceBy = toInput(friendly(Date.now() + 24 * HOUR, Date.now() + 12 * HOUR));
  const f = (k, label, hint, ph) => '<div class="field"><label for="f-' + k + '">' + label + (hint ? ' <span class="hint">' + hint + '</span>' : '') + '</label><input id="f-' + k + '" type="text" data-f="' + k + '" value="' + esc(s[k]) + '" placeholder="' + esc(ph) + '" autocomplete="off"></div>';
  return '<section class="screen"><p class="kicker" style="margin-top:4px">Your details</p><h2>Who is this reply for?</h2><p class="lead">Leave anything blank and fill it in later.</p>' +
    f('student', 'Your name', '', 'e.g. Mei Lin') + f('prof', 'Who sent the email?', '', 'e.g. Professor Smith') + f('course', 'Course', '', 'e.g. HIST 101') + f('assignment', 'What was flagged?', '', 'e.g. history essay') +
    '<div class="field"><label for="f-eb">When can you send your evidence? <span class="hint">(24 hours is a good aim)</span></label><input id="f-eb" type="datetime-local" data-fe="1" value="' + esc(st.evidenceBy) + '"></div>' +
    '<div class="navrow"><button class="btn ghost" data-a="freeback">Back</button><button class="btn primary" data-a="freemake">Write it ' + I.arrow + '</button></div><p class="private">' + I.lock + ' Stays on this phone.</p></section>';
}
function vFreeOut() {
  let h = '<section class="screen"><p class="kicker" style="margin-top:4px">Your first reply</p><h2>Short, calm, <em>clear.</em></h2><p class="lead">Read it once, fix any yellow parts, then send it. <button class="link" data-a="freeform">Change details</button></p>';
  h += tplCard(DATA.templates.first, 'first');
  h += guide('Sent it? Good. Now the real work starts: collecting your proof before your evidence deadline.');
  h += '<article class="card dark"><p class="kicker">The full kit</p><h2 style="margin-top:6px">Paper Trail: <em>the 48-hour defense kit</em></h2><p class="small" style="margin:4px 0 12px">For international students whose own work was flagged by an AI detector.</p>' +
    [['The 48-hour plan', 'Hour by hour, in simple English'], ['Proof Builder app', 'Your plan with real clock times, every email ready'], ['Detector Facts Sheet', 'Published research to attach to your reply'], ['Meeting practice', '10 likely questions and your opening words'], ['Visa and free help', 'US, UK, Canada and Australia']].map((x) => '<div class="lock"><span class="lk">' + I.lock.replace('currentColor', '#FFE45A').replace('currentColor', '#FFE45A') + '</span><span><b>' + x[0] + '</b><span>' + x[1] + '</span></span></div>').join('') +
    '<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:14px"><div><div class="price">$19</div><div class="small">One payment. Yours to keep.</div></div><a class="btn mark" style="white-space:nowrap;flex:0 0 auto" href="' + esc(KIT_URL) + '" target="_blank" rel="noopener">Get the kit ' + I.arrow + '</a></div></article>';
  h += '<article class="card"><h3>Know a friend who got the same email?</h3><p class="small" style="margin:6px 0 10px;color:var(--ink2)">This tool is free. Share it.</p><button class="btn sm" data-a="share">' + I.share + ' Share this free tool</button></article>';
  h += '<p class="foot">Paper Trail · General guidance, not legal advice.</p></section>';
  return h;
}

/* ---------- render ---------- */
const TABS = [['plan', 'Plan', 'plan'], ['emails', 'Emails', 'mail'], ['proof', 'Proof', 'proof'], ['meeting', 'Meeting', 'meet'], ['help', 'Help', 'help']];
function render(jump) {
  const views = { onboard: vOnboard, setup: vSetup, plan: vPlan, emails: vEmails, proof: vProof, meeting: vMeeting, help: vHelp, 'free-intro': vFreeIntro, 'free-form': vFreeForm, 'free-out': vFreeOut };
  const fn = views[st.screen] || (MODE === 'kit' ? vOnboard : vFreeIntro);
  app.innerHTML = header() + fn();
  const tabs = document.getElementById('tabs');
  const showTabs = MODE === 'kit' && st.built && TABS.some((t) => t[0] === st.screen);
  tabs.hidden = !showTabs;
  app.classList.toggle('notabs', !showTabs);
  if (showTabs) tabs.innerHTML = '<div class="in">' + TABS.map((t) => '<button class="tab" data-a="tab" data-v="' + t[0] + '"' + (st.screen === t[0] ? ' aria-current="page"' : '') + '>' + I[t[2]] + t[1] + '</button>').join('') + '</div>';
  if (jump) { const el = document.getElementById(jump); if (el) setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60); }
  st.justBuilt = false;
  Object.keys(st.stamped).forEach((k) => { if (st.stamped[k] === 'fresh') st.stamped[k] = 'shown'; });
}
function go(screen, jump) { st.screen = screen; st.flipped = false; save(); render(jump); if (!jump) window.scrollTo({ top: 0, behavior: 'smooth' }); }

/* ---------- actions ---------- */
const A = {
  start() { st.step = 0; go('setup'); },
  opt(el) {
    const f = el.dataset.f, v = el.dataset.v;
    st.setup[f] = v;
    if (f === 'receivedMode' && v === 'now') st.setup.received = new Date().toISOString();
    if (f === 'receivedMode' && v === 'earlier' && !st.setup.received) st.setup.received = '';
    if (f === 'hasDeadline' && v === 'no') st.setup.deadline = '';
    save(); render();
  },
  multi(el) {
    const f = el.dataset.f, v = el.dataset.v, arr = st.setup[f];
    const i = arr.indexOf(v);
    if (i > -1) arr.splice(i, 1);
    else {
      if (f === 'tools' && v === 'none') arr.length = 0;
      if (f === 'tools' && v !== 'none') { const j = arr.indexOf('none'); if (j > -1) arr.splice(j, 1); }
      arr.push(v);
    }
    save(); render();
  },
  next() { if (st.step < SETUP_STEPS - 1) { st.step++; save(); render(); window.scrollTo(0, 0); } },
  back() { if (st.step > 0) { st.step--; save(); render(); window.scrollTo(0, 0); } },
  build() {
    if (setupError()) { st.step = 1; render(); return; }
    st.built = true; st.justBuilt = true; st.open = null;
    go('plan');
    toast('Your plan is ready.', true);
  },
  edit(el) { st.step = +el.dataset.to || 0; go('setup'); },
  tab(el) { go(el.dataset.v, el.dataset.jump); },
  phase(el) { const k = el.dataset.k; st.open = st.open === k ? '__none' : k; save(); render(); },
  step(el) {
    const id = el.dataset.id;
    const before = phaseInfo().map((p) => p.status);
    st.done[id] = !st.done[id];
    if (id.indexOf('proof-') === 0) st.saved[id.slice(6)] = st.done[id];
    const after = phaseInfo();
    after.forEach((p, i) => {
      if (p.status === 'done' && before[i] !== 'done') {
        st.stamped[p.key] = 'fresh';
        const nxt = after[i + 1];
        toast(nxt ? p.name + ' done. Next: ' + nxt.name + '.' : 'All 4 phases done. You’re ready.', true);
        if (nxt) st.open = nxt.key;
      }
    });
    save(); render();
  },
  saved(el) {
    const k = el.dataset.k;
    st.saved[k] = !st.saved[k];
    st.done['proof-' + k] = st.saved[k];
    save(); render();
    if (st.saved[k]) toast('Saved. One more piece of your paper trail.');
  },
  addproof(el) { st.setup.proofs.push(el.dataset.k); save(); render(); toast('Added. Its steps are now in your plan.'); },
  copy(el) { const t = TPL()[el.dataset.k]; const v = vals(); copyText('Subject: ' + fill(t.subject, v, false) + '\n\n' + fill(t.body, v, false), el); },
  copysubj(el) { const t = TPL()[el.dataset.k]; copyText(fill(t.subject, vals(), false), el); },
  copyopen(el) { copyText(fill(DATA.opening, vals(), false), el); },
  copymock(el) { copyText(DATA.mock, el); },
  tladd() { st.timeline.push({ d: '', w: '', x: '' }); save(); render('p-timeline'); },
  tldel(el) { st.timeline.splice(+el.dataset.i, 1); save(); render('p-timeline'); },
  tlcopy(el) { copyText(timelineText(), el); },
  flip() { st.flipped = !st.flipped; const f = app.querySelector('.flip'); if (f) f.classList.toggle('on', st.flipped); },
  qnext() { st.q = st.q < DATA.questions.length - 1 ? st.q + 1 : 0; st.flipped = false; save(); render(); },
  qprev() { if (st.q > 0) { st.q--; st.flipped = false; save(); render(); } },
  country(el) { st.helpCountry = el.dataset.v; save(); render(); },
  reset() {
    if (!st.confirmReset) { st.confirmReset = true; render(); setTimeout(() => { st.confirmReset = false; }, 5000); return; }
    try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
    st = fresh(); render(); window.scrollTo(0, 0); toast('Everything was deleted from this phone.');
  },
  closemodal() { document.getElementById('modal').hidden = true; },
  freeform() { go('free-form'); },
  freeback() { go('free-intro'); },
  freemake() { go('free-out'); toast('Your reply is ready.', true); },
  share(el) {
    const url = location.href;
    if (navigator.share) { navigator.share({ title: 'Paper Trail: free first-reply tool', text: 'Got an AI-cheating email? Write a calm first reply in 2 minutes.', url }).catch(() => {}); }
    else copyText(url, el);
  },
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.a];
  if (fn) { fn(el, e); }
});
document.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.flip')) { e.preventDefault(); A.flip(); }
  if (e.key === 'Escape') A.closemodal();
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.f) {
    const f = t.dataset.f;
    st.setup[f] = (t.type === 'datetime-local' && t.value) ? new Date(t.value).toISOString() : t.value;
    save();
    if (t.type === 'datetime-local') render();
  } else if (t.dataset.fe) {
    st.evidenceBy = t.value; save();
  } else if (t.dataset.tl !== undefined) {
    const r = st.timeline[+t.dataset.tl];
    if (r) { r[t.dataset.k] = t.value; save(); const o = document.getElementById('tlout'); if (o) o.textContent = timelineText(); }
  }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.tl !== undefined) { const r = st.timeline[+t.dataset.tl]; if (r) { r[t.dataset.k] = t.value; save(); const o = document.getElementById('tlout'); if (o) o.textContent = timelineText(); } }
});
document.getElementById('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') A.closemodal(); });

// Keep the clock honest without disturbing what the student is doing.
setInterval(() => {
  if (st.screen !== 'plan') return;
  const ring = document.getElementById('ring');
  if (!ring) return;
  const b = bounds(), cd = countdown(b);
  ring.querySelector('svg').outerHTML = ringSVG(b, Date.now(), false);
  const big = ring.querySelector('.cd'); if (big) big.innerHTML = cd.big;
}, 30000);

if (MODE === 'kit' && st.built && ['onboard', 'setup'].indexOf(st.screen) === -1) { /* resume where they left off */ }
render();
</script>
</body>
</html>
