<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1020">
<title>CP2000 Rescue · Free check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* CP2000 Rescue. A calm night desk: dark ink, amber = needs you, green = done, red = urgent.
   One phone-width column, one question per screen, nothing leaves the device. */
:root {
  --bg: #0B1020; --card: #141B2E; --card2: #1A2238;
  --line: rgba(255, 255, 255, .09); --line2: rgba(255, 255, 255, .16);
  --text: #F3F1EA; --text2: #C9D0DC; --muted: #8E97AA;
  --amber: #FFB547; --amber2: rgba(255, 181, 71, .13);
  --green: #2FE39A; --green2: rgba(47, 227, 154, .12);
  --red: #FF6B5E; --red2: rgba(255, 107, 94, .13);
  --ink: #0B1020;
  --serif: 'Instrument Serif', Georgia, serif;
  --sans: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --r: 18px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  background-image:
    radial-gradient(ellipse 90% 34% at 8% -4%, rgba(255, 181, 71, .17), rgba(255, 181, 71, 0) 70%),
    radial-gradient(ellipse 80% 30% at 100% 104%, rgba(47, 227, 154, .11), rgba(47, 227, 154, 0) 70%);
  background-attachment: fixed;
  color: var(--text); font-family: var(--sans); font-size: 15.5px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; min-height: 100vh;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--green); }
::selection { background: rgba(255, 181, 71, .35); }
h1:focus, h2:focus { outline: none; }
.app { max-width: 460px; margin: 0 auto; padding: 10px 18px 56px; }
.screen { animation: rise .42s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.center { text-align: center; justify-content: center; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 2px 10px; }
.brand { display: flex; gap: 9px; align-items: center; font-family: var(--mono); font-weight: 700; font-size: 11.5px; letter-spacing: .2em; white-space: nowrap; }
.brand svg { width: 26px; height: 26px; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text2); border: 1px solid var(--line2); border-radius: 999px; padding: 6px 10px; background: rgba(255, 255, 255, .03); white-space: nowrap; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
.iconbtn { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line2); background: rgba(255, 255, 255, .03); display: grid; place-items: center; cursor: pointer; color: var(--text2); flex: none; transition: transform .12s; }
.iconbtn:active { transform: scale(.94); }
.iconbtn svg { width: 18px; height: 18px; }

/* Progress */
.prog { display: flex; gap: 6px; margin: 2px 0 4px; }
.prog i { flex: 1; height: 5px; border-radius: 9px; background: rgba(255, 255, 255, .1); overflow: hidden; position: relative; }
.prog i::after { content: ''; position: absolute; inset: 0; background: var(--amber); transform: scaleX(0); transform-origin: left; transition: transform .6s cubic-bezier(.2, .8, .2, 1); }
.prog i.on::after { transform: scaleX(1); }
.prog i.done::after { transform: scaleX(1); background: var(--green); }
.steplabel { font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 8px 0 2px; }

/* Type */
h1 { font-weight: 800; font-size: 32px; line-height: 1.06; letter-spacing: -.025em; margin: 12px 0 12px; }
h1 em, h2 em { font-family: var(--serif); font-style: italic; font-weight: 400; color: var(--green); letter-spacing: 0; }
.amb { color: var(--amber); }
h2 { font-weight: 750; font-size: 23px; line-height: 1.18; letter-spacing: -.015em; margin: 10px 0 8px; }
h3 { font-weight: 700; font-size: 16.5px; line-height: 1.3; margin: 0 0 6px; }
p { margin: 0 0 10px; color: var(--text2); }
.lead { font-size: 16.5px; }
.small { font-size: 13.5px; color: var(--muted); }
.kicker { font-family: var(--mono); font-weight: 700; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin: 24px 0 10px; }
.kicker.green { color: var(--green); }
.kicker.amber { color: var(--amber); }
b, strong { color: var(--text); }

/* Cards and chips */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin: 12px 0; }
.card.alert { background: linear-gradient(180deg, rgba(255, 107, 94, .15), rgba(255, 107, 94, .06)); border-color: rgba(255, 107, 94, .45); }
.card.ok { background: linear-gradient(180deg, rgba(47, 227, 154, .12), rgba(47, 227, 154, .05)); border-color: rgba(47, 227, 154, .42); }
.card.warn { background: var(--amber2); border-color: rgba(255, 181, 71, .42); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; padding: 5px 9px; border-radius: 999px; border: 1px solid var(--line2); color: var(--text2); white-space: nowrap; }
.chip.red { color: var(--red); border-color: rgba(255, 107, 94, .5); background: var(--red2); }
.chip.green { color: var(--green); border-color: rgba(47, 227, 154, .5); background: var(--green2); }
.chip.amber { color: var(--amber); border-color: rgba(255, 181, 71, .5); background: var(--amber2); }

/* Buttons: tactile, with a pressed state */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 12px 18px; border-radius: 14px; border: 1px solid var(--line2); background: var(--card2); color: var(--text); font-weight: 650; cursor: pointer; text-decoration: none; transition: transform .12s ease, background .2s ease, border-color .2s ease, box-shadow .2s, opacity .2s; -webkit-tap-highlight-color: transparent; }
.btn:active { transform: scale(.97); }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.primary { background: var(--amber); color: var(--ink); border-color: var(--amber); box-shadow: 0 10px 24px -12px rgba(255, 181, 71, .7), inset 0 -2px 0 rgba(0, 0, 0, .18); }
.btn.primary:hover { background: #FFC46E; }
.btn.go { background: var(--green); color: var(--ink); border-color: var(--green); box-shadow: 0 10px 24px -12px rgba(47, 227, 154, .7), inset 0 -2px 0 rgba(0, 0, 0, .18); }
.btn.ghost { background: transparent; }
.btn.sm { min-height: 42px; padding: 8px 13px; font-size: 14px; border-radius: 12px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .38; pointer-events: none; box-shadow: none; }
.btn.copied { background: var(--green2); border-color: rgba(47, 227, 154, .6); color: var(--green); }
.btn:focus-visible, .opt:focus-visible, .ftile:focus-visible, .chk:focus-visible, .switch:focus-visible, .iconbtn:focus-visible, .linkbtn:focus-visible, input:focus-visible { outline: 2.5px solid var(--amber); outline-offset: 2px; }
.linkbtn { background: none; border: 0; padding: 6px 0; color: var(--green); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.navrow { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin-top: 18px; }
.navrow .btn.primary, .navrow .btn.go { flex: 1; }

/* Guide character: Letty the letter, used sparingly */
.guide { display: flex; gap: 12px; align-items: flex-start; margin: 14px 0; }
.guide .av { flex: none; animation: bob 4.6s ease-in-out infinite; }
.guide .bub { position: relative; background: var(--card2); border: 1px solid var(--line2); border-radius: 4px 16px 16px 16px; padding: 11px 14px; color: var(--text2); font-size: 14.5px; }
.guide .bub b.who { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--amber); margin-bottom: 3px; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-4px) rotate(3deg); } }
.letty .eyes { animation: blink 5.2s infinite; transform-origin: center; transform-box: fill-box; }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.12); } }
.letty.happy { animation: hop .7s cubic-bezier(.3, 1.6, .5, 1) 1; }
@keyframes hop { 0% { transform: translateY(0); } 40% { transform: translateY(-9px) rotate(-6deg); } 100% { transform: translateY(0); } }

/* Intro list */
.gets { display: grid; gap: 10px; margin: 16px 0 18px; }
.get { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
.get .gi { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--amber2); color: var(--amber); flex: none; }
.get .gi svg { width: 20px; height: 20px; }
.get b { display: block; }
.get span { display: block; font-size: 13.5px; color: var(--muted); }
.privacy { display: flex; gap: 8px; align-items: center; justify-content: center; font-size: 13px; color: var(--muted); margin: 12px 0 2px; }
.privacy svg { width: 15px; height: 15px; color: var(--green); flex: none; }

/* Options (one choice) */
.opts { display: grid; gap: 10px; margin: 14px 0; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px; border-radius: 16px; border: 1px solid var(--line2); background: var(--card); cursor: pointer; transition: transform .12s, border-color .2s, background .2s; -webkit-tap-highlight-color: transparent; }
.opt:active { transform: scale(.98); }
@media (hover: hover) { .opt:hover, .ftile:hover { border-color: rgba(255, 181, 71, .55); } }
.opt .code { width: 72px; height: 40px; padding: 0 6px; border-radius: 12px; display: grid; place-items: center; background: var(--card2); flex: none; font-family: var(--mono); font-weight: 700; font-size: 11.5px; color: var(--amber); }
.opt .ot { flex: 1; }
.opt .ot b { display: block; font-weight: 650; }
.opt .ot span { display: block; font-size: 13.5px; color: var(--muted); margin-top: 1px; }
.tick { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line2); display: grid; place-items: center; flex: none; transition: background .2s, border-color .2s; }
.tick svg { width: 14px; height: 14px; color: var(--ink); opacity: 0; }
.opt[aria-pressed="true"] { border-color: var(--green); background: linear-gradient(180deg, rgba(47, 227, 154, .10), rgba(47, 227, 154, .04)); }
.opt[aria-pressed="true"] .tick, .ftile[aria-pressed="true"] .tick { background: var(--green); border-color: var(--green); animation: pop .32s; }
.opt[aria-pressed="true"] .tick svg, .ftile[aria-pressed="true"] .tick svg { opacity: 1; }
@keyframes pop { 0% { transform: scale(.6); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }

/* Form tiles (many choices) */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
.ftile { position: relative; text-align: left; padding: 13px 12px 12px; border-radius: 16px; border: 1px solid var(--line2); background: var(--card); cursor: pointer; min-height: 96px; transition: transform .12s, border-color .2s, background .2s; -webkit-tap-highlight-color: transparent; }
.ftile:active { transform: scale(.97); }
.ftile b { display: block; font-family: var(--mono); font-size: 12.5px; letter-spacing: .02em; color: var(--amber); padding-right: 26px; }
.ftile span { display: block; font-size: 13.5px; color: var(--text2); margin-top: 5px; line-height: 1.3; }
.ftile .tick { position: absolute; top: 10px; right: 10px; width: 22px; height: 22px; }
.ftile[aria-pressed="true"] { border-color: var(--green); background: linear-gradient(180deg, rgba(47, 227, 154, .10), rgba(47, 227, 154, .04)); }
.ftile.wide { grid-column: span 2; min-height: 0; }

/* Where to look: a tiny letter sketch */
.sketch { display: flex; gap: 14px; align-items: center; padding: 12px 14px; border-radius: 16px; border: 1px dashed var(--line2); margin: 12px 0; }
.sketch svg { width: 74px; height: 92px; flex: none; }
.sketch p { margin: 0; font-size: 14px; }

/* Deadline */
.field { margin: 14px 0 6px; }
.field label { display: block; font-weight: 650; margin-bottom: 7px; }
.field input[type=date] { width: 100%; min-height: 54px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line2); background: var(--card2); color: var(--text); font-size: 17px; }
.switch { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 0; cursor: pointer; background: none; border: 0; text-align: left; color: var(--text2); }
.switch .tg { width: 48px; height: 28px; border-radius: 999px; background: rgba(255, 255, 255, .14); position: relative; transition: background .2s; flex: none; }
.switch .tg::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--text); transition: transform .24s cubic-bezier(.2, .8, .2, 1); }
.switch[aria-checked="true"] .tg { background: var(--green); }
.switch[aria-checked="true"] .tg::after { transform: translateX(20px); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 14px; background: var(--card); border: 1px solid var(--line2); margin: 14px 0 4px; }
.seg button { min-height: 42px; border: 0; border-radius: 10px; background: transparent; color: var(--text2); font-weight: 650; cursor: pointer; transition: background .2s, color .2s; }
.seg button[aria-checked="true"] { background: var(--amber); color: var(--ink); }
.seg button:focus-visible { outline: 2.5px solid var(--amber); outline-offset: 2px; }
.dl { display: flex; gap: 16px; align-items: center; }
.ring { width: 108px; height: 108px; flex: none; }
.ring .arc { transition: stroke-dashoffset 1.1s cubic-bezier(.2, .8, .2, 1); }
.dl .due { font-weight: 750; font-size: 19px; line-height: 1.25; color: var(--text); }
.dl .st { font-size: 14px; margin-top: 4px; }
.lv-ok { color: var(--green); } .lv-soon { color: var(--amber); } .lv-urgent, .lv-today, .lv-past { color: var(--red); }

/* Plan */
.item { animation: rise .5s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 90ms); }
.item .ih { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.item h3 { margin-top: 2px; }
.sub { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 12px 0 2px; }
.chk { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; background: none; border: 0; padding: 8px 0; cursor: pointer; color: var(--text2); -webkit-tap-highlight-color: transparent; }
.chk .bx { width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--line2); flex: none; display: grid; place-items: center; margin-top: 1px; transition: background .2s, border-color .2s; }
.chk .bx svg { width: 13px; height: 13px; color: var(--ink); opacity: 0; }
.chk[aria-checked="true"] .bx { background: var(--green); border-color: var(--green); animation: pop .32s; }
.chk[aria-checked="true"] .bx svg { opacity: 1; }
.chk[aria-checked="true"] .lbl { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(255, 255, 255, .3); }
.tip { display: flex; gap: 8px; font-size: 13.5px; color: var(--muted); margin-top: 8px; }
.tip svg { width: 15px; height: 15px; flex: none; margin-top: 3px; color: var(--amber); }
.meter { height: 6px; border-radius: 9px; background: rgba(255, 255, 255, .1); overflow: hidden; margin-top: 10px; }
.meter i { display: block; height: 100%; background: var(--green); border-radius: 9px; transition: width .5s cubic-bezier(.2, .8, .2, 1); }
ol.steps { margin: 6px 0 0; padding: 0; list-style: none; counter-reset: s; }
ol.steps li { counter-increment: s; display: flex; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); color: var(--text2); }
ol.steps li:first-child { border-top: 0; }
ol.steps li::before { content: counter(s); width: 26px; height: 26px; border-radius: 50%; background: var(--amber2); color: var(--amber); font-family: var(--mono); font-weight: 700; font-size: 12.5px; display: grid; place-items: center; flex: none; }
/* When the list is also a card, keep the card's inner space so the number circles sit inside the border. */
ol.steps.card { padding: 4px 14px; margin: 14px 0; }
ol.steps.card li { padding: 11px 0; align-items: flex-start; }
ul.dots { margin: 6px 0 0; padding-left: 18px; color: var(--text2); }
ul.dots li { margin: 5px 0; }
.kit { position: relative; overflow: hidden; }
.kit::before { content: ''; position: absolute; inset: -40% -20% auto auto; width: 220px; height: 220px; background: radial-gradient(circle, rgba(255, 181, 71, .22), rgba(255, 181, 71, 0) 65%); animation: drift 9s ease-in-out infinite alternate; pointer-events: none; }
@keyframes drift { from { transform: translate(0, 0); } to { transform: translate(-30px, 24px); } }

/* Sheet (bottom drawer) */
.sheet-wrap { position: fixed; inset: 0; background: rgba(5, 7, 13, .64); display: flex; align-items: flex-end; justify-content: center; z-index: 50; animation: fade .2s; }
.sheet-wrap[hidden] { display: none; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.sheet { width: 100%; max-width: 480px; max-height: 86vh; overflow: auto; background: var(--card); border: 1px solid var(--line2); border-bottom: 0; border-radius: 24px 24px 0 0; padding: 10px 18px calc(22px + env(safe-area-inset-bottom)); animation: up .34s cubic-bezier(.2, .8, .2, 1); }
.sheet .grab { width: 44px; height: 5px; border-radius: 9px; background: var(--line2); margin: 4px auto 10px; }
.sheet h2 { margin-top: 4px; }
.sheet textarea { width: 100%; min-height: 220px; border-radius: 12px; border: 1px solid var(--line2); background: var(--card2); padding: 12px; font-size: 13.5px; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }

/* Toast */
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translate(-50%, 24px); opacity: 0; pointer-events: none; display: flex; gap: 10px; align-items: center; background: var(--card2); border: 1px solid var(--line2); border-radius: 16px; padding: 10px 14px; box-shadow: 0 18px 40px -16px rgba(0, 0, 0, .7); transition: transform .3s cubic-bezier(.2, .8, .2, 1), opacity .3s; z-index: 60; max-width: 92vw; font-size: 14.5px; }
.toast.on { transform: translate(-50%, 0); opacity: 1; }

/* Footer */
.foot { margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.foot p { color: var(--muted); font-size: 12.5px; }
.foot a { color: var(--text2); }


/* ===== Kit: progress milestones ===== */
.miles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 2px 0 8px; }
.mile { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 2px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-align: center; transition: background .3s, border-color .3s, color .3s; }
.mile i { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--line2); font-style: normal; font-size: 10.5px; color: var(--text2); }
.mile i svg { width: 12px; height: 12px; }
.mile.done { border-color: rgba(47, 227, 154, .45); color: var(--green); background: var(--green2); }
.mile.done i { background: var(--green); border-color: var(--green); color: var(--ink); animation: pop .32s; }
/* ===== Kit: bottom tabs ===== */
.app.tabs { padding-bottom: calc(100px + env(safe-area-inset-bottom)); }
.tabbar { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: 480px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: rgba(11, 16, 32, .94); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-top: 1px solid var(--line2); z-index: 40; }
.tabbar button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; border: 0; border-radius: 12px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 650; cursor: pointer; position: relative; transition: background .2s, color .2s, transform .12s; -webkit-tap-highlight-color: transparent; }
.tabbar button:active { transform: scale(.95); }
.tabbar button svg { width: 20px; height: 20px; }
.tabbar button[aria-current="page"] { color: var(--amber); background: var(--amber2); }
.tabbar button:focus-visible { outline: 2.5px solid var(--amber); outline-offset: 2px; }
.tabbar .badge { position: absolute; top: 5px; right: 22%; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--amber); color: var(--ink); font-size: 10.5px; font-weight: 800; display: grid; place-items: center; }
/* ===== Kit: item accordion, inputs, statement ===== */
.acc { padding: 0; overflow: hidden; }
.acc > .ah { display: flex; flex-direction: column; align-items: stretch; gap: 8px; width: 100%; text-align: left; padding: 14px 14px; background: none; border: 0; cursor: pointer; color: var(--text); -webkit-tap-highlight-color: transparent; }
.acc .ahtop { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.acc .ahtop .chev { margin-left: auto; }
.acc .ah .t { flex: 1; min-width: 0; font-size: 14.5px; line-height: 1.3; }
.acc .ah .chev { color: var(--muted); display: grid; transition: transform .25s; }
.acc .ah .chev svg { width: 18px; height: 18px; }
.acc.open .ah .chev { transform: rotate(180deg); }
.acc .ab { padding: 0 14px 16px; animation: rise .35s both; }
.acc.done { border-color: rgba(47, 227, 154, .42); }
.seg.seg3 { grid-template-columns: 1fr 1fr 1fr; }
.seg.seg3 button { font-size: 13px; line-height: 1.2; padding: 4px; }
.inp { margin: 10px 0; }
.inp label { display: block; font-size: 13.5px; font-weight: 650; color: var(--text2); margin-bottom: 5px; }
.inp input, .inp textarea { width: 100%; min-height: 48px; padding: 11px 13px; border-radius: 12px; border: 1px solid var(--line2); background: var(--card2); color: var(--text); font-size: 16px; transition: border-color .2s; }
.inp input:focus, .inp textarea:focus { border-color: var(--amber); outline: none; }
.inp textarea { min-height: 96px; resize: vertical; line-height: 1.45; }
.inp small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.stmt { background: #FBFAF6; color: #1B1F2A; border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 1.55; margin: 6px 0 12px; }
.ph { background: rgba(255, 181, 71, .38); color: #6B4300; border-radius: 4px; padding: 0 3px; font-weight: 600; }
.fv { background: rgba(47, 227, 154, .22); border-radius: 4px; padding: 0 2px; }
/* ===== Kit: the letter on paper ===== */
.paper { background: #FBFAF6; color: #1B1F2A; border-radius: 16px; padding: 20px 18px; font-size: 13.5px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: 0 24px 48px -24px rgba(0, 0, 0, .8); margin: 12px 0; animation: rise .5s both; }
.paper .fv { background: transparent; padding: 0; }
.paper b { color: #1B1F2A; }
.sentcard { text-align: center; }
.sentcard .letty { margin: 0 auto 4px; }
.app.still .screen, .app.still .item, .app.still .acc .ab, .app.still .paper { animation: none; }
@media print {
  body { background: #fff !important; }
  body * { visibility: hidden !important; }
  #paper, #paper * { visibility: visible !important; }
  #paper { position: absolute; left: 0; top: 0; width: 100%; box-shadow: none; border-radius: 0; font-size: 11.5pt; }
  .ph { background: none; color: #000; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

ou paid. When box 1e is blank, the IRS uses a **$0 cost**, so the letter treats the whole sale price as profit. Show what you paid, so the tax is based on your real gain.", "answer": "some", "proof": ["Statements showing what you paid for each sale", "Form 8949 and Schedule D listing each sale with your real cost", "A short signed statement that answers this item"], "tip": "Your broker’s website usually keeps old statements and trade confirmations."}, "b_cost_on_form": {"title": "Sale left off, but the cost was reported", "means": "When the broker reports your cost, the IRS uses it, so the letter may already show your real gain. Compare the letter’s numbers with your 1099-B.", "answer": "check", "proof": ["Your 1099-B", "The letter’s table of changes"], "tip": "If the numbers match your records, agreeing may be right. Job stock (RSU, ESPP)? The reported cost can be too low."}, "b_need_form": {"title": "Sale left off: get your 1099-B first", "means": "Download your 1099-B from your broker. If box 1e (cost) is blank, the IRS used $0 as your cost. If it shows an amount, the letter should already use it.", "answer": "check", "proof": ["Your 1099-B from your broker", "Statements showing what you paid"]}, "b_equity": {"title": "Job stock: the cost on the form may be too low", "means": "With RSUs, ESPP or options, part of the stock’s value was already taxed as pay on your W-2. The broker’s cost often leaves that out, so the gain looks bigger than it is.", "answer": "some", "proof": ["Your W-2 for that year", "Your broker’s supplemental statement or vesting and purchase records", "Form 8949 with the cost corrected (adjustment code B)", "A short signed statement that answers this item"], "tip": "This one is easy to get wrong. For big amounts, consider a tax pro."}, "b_reported": {"title": "The sale is already on your return", "means": "The IRS compares the broker’s sale amounts with your Form 8949. Grouped sales, different totals, or sales on another form can look like a mis s item"], "tip": "If your 1099 total is bigger than line 1, explain the difference in your statement."}, "nec_business": {"title": "Reported on your business’s own return", "means": "If the money was reported on a partnership or S corporation return, say so. Give that business’s name and EIN, or the IRS may write to ask for them.", "answer": "disagree", "proof": ["The business’s name and EIN", "The page of the business return showing the income", "A short signed statement that answers this item"], "tip": "Business-return cases can get complex. Consider a tax pro.", "help": true}, "nec_missed_costs": {"title": "Missed income, but you had business costs", "means": "The letter adds the income and usually **self-employment tax**. You can list the costs you had to earn it. The IRS staff manual says the amount can be reduced by expenses you show.", "answer": "some", "proof": ["A list of that year’s business costs, with totals", "Receipts or bank statements for those costs", "A short signed statement that answers this item"]}, "nec_missed": {"title": "Income left off your return", "means": "If you simply missed it and had no costs, the letter is likely right. The change usually includes **self-employment tax**.", "answer": "agree", "proof": ["Your 1099-NEC or 1099-MISC", "Check the letter’s math against it"], "tip": "Check other years too. The IRS says to amend past returns that have the same mistake."}, "k_in_c": {"title": "Already counted in your business income", "means": "The letter uses the **gross** amount on the 1099-K. If those sales are already in your business income, show how the totals match.", "answer": "disagree", "proof": ["A copy of your Schedule C", "The platform’s yearly report", "A short table matching the 1099-K to your income records"]}, "k_missed_costs": {"title": "Business sales left off, with costs", "means": "Real business sales are taxable. But the letter starts from the gross amount, so list your costs, like the goods you sold and fees.", "answer     try {

  }
  if (ok && btn) {
    const old = btn.innerHTML; btn.classList.add('copied'); btn.innerHTML = I.check + '<span>Copied</span>';
    setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = old; }, 1700);
  } else if (!ok) openSheetHTML('<h2>Copy your plan</h2><p class="small">Your browser blocked automatic copying. Press and hold inside the box, choose Select all, then Copy.</p><textarea readonly>' + esc(txt) + '</textarea>');

  },
  qBack: () => {
    const fid = st.forms[st.qi]; const p = st.paths[fid] || [];
    if (p.length) { p.pop(); save(); go('q'); return; }
    for (let j = st.qi - 1; j >= 0; j--) { const pp = st.paths[st.forms[j]] || []; if (pp.length) { pp.pop(); st.qi = j; save(); go('q'); return; } }
    go('forms');
  },
  redo: (el) => { const id = el.dataset.id; st.paths[id] = []; st.qi = st.forms.indexOf(id); go('q'); },
  editForms: () => go('forms'),
  editDate: () => go('date'),
  tick: (el) => {
    const k = el.dataset.k; st.ticks[k] = !st.ticks[k]; if (!st.ticks[k]) delete st.ticks[k]; save();
    el.setAttribute('aria-checked', String(!!st.ticks[k]));
    const list = items();
    const total = list.reduce((n, x) => n + x.c.proof.length, 0);
    const ticked = list.reduce((n, x) => n + x.c.proof.filter((p, j) => st.ticks[proofKey(x.f.id, j)]).length, 0);
    const pc = document.getElementById('pcount'); if (pc) pc.textContent = ticked + ' of ' + total + ' proof items ready';
    const pm = document.getElementById('pmeter'); if (pm) pm.style.width = Math.round(100 * ticked / total) + '%';
    if (st.ticks[k] && ticked === total) toast(esc(DATA.plan.allProof));
  },
  copy: (el) => copyText(planText(), el),
  restart: () => openSheetHTML('<h2>Start over?</h2><p>This clears your answers on this phone.</p><div class="row"><button class="btn primary" data-act="confirmRestart">Yes, start over</button></div>'),
  confirmRestart: () => { try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ } st = fresh(); closeSheet(); go('intro'); },
  sheet: (el) => openSheetHTML(sheetHTML(el.dataset.k)),
  closeSheet: () => closeSheet(),
};
Object.assign(A, KA);
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  if (el.dataset.act === 'emailLetter') { el.href = 'mailto:?subject=' + encodeURIComponent('My CP2000 reply letter') + '&body=' + encodeURIComponent(letterText(false)); return; }
  if (el.dataset.act === 'email') { el.href = 'mailto:?subject=' + encodeURIComponent('My CP2000 plan') + '&body=' + encodeURIComponent(planText()); return; }
  const f = A[el.dataset.act]; if (!f) return;
  e.preventDefault(); f(el, e);
});
document.getElementById('sheet').addEventListener('click', (e) => { if (e.target.id === 'sheet') closeSheet(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !document.getElementById('sheet').hidden) closeSheet(); });
render();
</script>
</body>
