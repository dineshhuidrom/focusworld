<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script src="../src/logic.js"></script><script src="../src/items.js"></script><script src="../src/places.js"></script><script src="../src/world.js"></script>
<script>
window.renderAt = function (min, sky, W, H, area, rain, seedling, t, scene) {
  var c = document.getElementById('c'); c.width = W * 2; c.height = H * 2; c.style.width = W + 'px'; c.style.height = H + 'px';
  var ctx = c.getContext('2d'); ctx.setTransform(2, 0, 0, 2, 0, 0);
  FWWorld.renderStatic(ctx, W, H, area, { min: min, seed: 12345, sky: sky, rain: rain || 0, calm: false, seedling: seedling || null, scene: scene || 'meadow' }, t || 12.3);
  return true;
};
</script></body></html>
